name: Check skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/launch-wechat-miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_skill.py .
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: skills/launch-wechat-miniprogram/tools/visual-regression
        run: npm ci --ignore-scripts && npm test
      - working-directory: skills/launch-wechat-miniprogram/tools/signup-property-tests
        run: npm ci --ignore-scripts && npm test

      - run: python scripts/validate_miniprogram_artifacts.py assets/signup-demo
      - working-directory: skills/launch-wechat-miniprogram/assets/signup-demo
        run: node --test tests/*.test.js
      - working-directory: skills/launch-wechat-miniprogram/assets/qa-module
        run: npm test
